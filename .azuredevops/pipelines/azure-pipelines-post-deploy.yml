# Reusable post-deployment and live end-to-end test stage.

parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: azureEnvName
    type: string
  - name: subscriptionId
    type: string
  - name: dependsOn
    type: string
    default: Provision

stages:
  - stage: PostDeployTest
    displayName: Post-deploy and tests
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    jobs:
      - job: post_deploy
        displayName: Run post-deploy scripts
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: Download infra outputs (if published)
            continueOnError: true
            inputs:
              artifact: infra-outputs
              path: $(Pipeline.Workspace)/infra-outputs

          - task: AzureCLI@2
            displayName: Read config from the resource group and hydrate azd env
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='${{ parameters.resourceGroup }}'
                AZD_ENV='${{ parameters.azureEnvName }}'
                export AZURE_SUBSCRIPTION_ID='${{ parameters.subscriptionId }}'

                ART="${PIPELINE_WORKSPACE:-$(pwd)}/infra-outputs/infra-outputs.json"
                if [ -s "$ART" ] && [ "$(tr -d '[:space:]' < "$ART")" != "{}" ]; then
                  cp "$ART" infra-outputs.json
                else
                  DEP="$(az deployment group list --resource-group "$RG" \
                    --query "sort_by([?properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" \
                    -o tsv)"
                  [ -n "$DEP" ] && [ "$DEP" != "None" ]
                  az deployment group show --resource-group "$RG" --name "$DEP" \
                    --query properties.outputs -o json > infra-outputs.json
                fi

                curl -fsSL https://aka.ms/install-azd.sh | bash
                azd auth login \
                  --client-id "$servicePrincipalId" \
                  ${servicePrincipalKey:+--client-secret "$servicePrincipalKey"} \
                  ${servicePrincipalKey:+--tenant-id "$tenantId"} \
                  ${servicePrincipalKey:--federated-credential-provider "azure-pipelines"} \
                  1>/dev/null 2>&1 || true
                azd env new "$AZD_ENV" --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt \
                  || azd env select "$AZD_ENV"
                azd env set AZURE_RESOURCE_GROUP "$RG"

                jq -r '
                  to_entries[]
                  | select((.value.value | type) as $t | $t=="string" or $t=="number" or $t=="boolean")
                  | "\(.key | ascii_upcase)\t\(.value.value | tostring)"
                ' infra-outputs.json > kv.tsv

                : > .env
                while IFS="$(printf '\t')" read -r key value; do
                  [ -n "$key" ] || continue
                  azd env set "$key" "$value" >/dev/null
                  printf '%s=%s\n' "$key" "$value" >> .env
                  echo "##vso[task.setvariable variable=$key]$value"
                done < kv.tsv
                echo "Hydrated $(wc -l < kv.tsv) deployment outputs."

          - task: UsePythonVersion@0
            displayName: Use Python 3.11
            inputs:
              versionSpec: "3.11"

          - task: Bash@3
            displayName: Install post-deploy Python dependencies
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                python -m pip install uv
                uv pip install --system -r infra/scripts/post-provision/requirements.txt

          - task: AzureCLI@2
            displayName: Deploy and configure the application
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_ENV_NAME='${{ parameters.azureEnvName }}'
                export AZURE_RESOURCE_GROUP='${{ parameters.resourceGroup }}'
                export AZURE_SUBSCRIPTION_ID='${{ parameters.subscriptionId }}'

                run_step() {
                  runner="$1"; path="$2"; shift 2
                  if [ ! -f "$path" ]; then
                    echo "##vso[task.logissue type=error]Post-deploy script '$path' not found."
                    return 1
                  fi
                  echo "----- $runner $path"
                  case "$runner" in
                    bash) bash "$path" "$@" ;;
                    pwsh) pwsh -File "$path" "$@" ;;
                    python) python "$path" "$@" ;;
                    *) echo "Unknown runner: $runner"; return 1 ;;
                  esac
                }

                run_step bash infra/scripts/build/build-and-push-acr.sh \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --subscription "$AZURE_SUBSCRIPTION_ID"
                printf '\n' | run_step python infra/scripts/post-provision/00_build_solution.py \
                  --scenario default
                if ! run_step pwsh infra/scripts/post-provision/setup_app_authentication.ps1 \
                  -Environment "$AZURE_ENV_NAME" \
                  -ResourceGroup "$AZURE_RESOURCE_GROUP" \
                  -FrontendAppName "$WEB_APP_NAME" \
                  -ApiAppName "$API_APP_NAME"; then
                  echo "##vso[task.logissue type=warning]OBO authentication setup did not complete; review the manual steps summary."
                fi

          - task: Bash@3
            displayName: Manual post-steps (reminder)
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                cat > "$(Build.ArtifactStagingDirectory)/manual-post-steps.md" <<'REMINDER'
                ### Post-deploy manual steps not run by CI

                * Enable the Fabric tenant settings for Ontology, Graph, and Copilot and Azure OpenAI Service.
                * If OBO admin consent fails, have a tenant administrator grant consent in Microsoft Entra ID.
                * OBO setup creates an app registration and client secret outside the resource group; resource-group cleanup does not remove them.
                REMINDER
                echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/manual-post-steps.md"

      - job: playwright
        displayName: Playwright / e2e tests
        dependsOn: post_deploy
        condition: succeeded()
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"

          - task: AzureCLI@2
            displayName: Read deployed application URL
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: tests/e2e-test
              inlineScript: |
                set -euo pipefail
                RG='${{ parameters.resourceGroup }}'
                DEP="$(az deployment group list --resource-group "$RG" \
                  --query "sort_by([?properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" \
                  -o tsv)"
                URL="$(az deployment group show --resource-group "$RG" --name "$DEP" \
                  --query properties.outputs -o json \
                  | jq -r 'to_entries[] | select((.key | ascii_upcase) == "WEB_APP_URL") | .value.value' \
                  | head -n1)"
                [ -n "$URL" ] && [ "$URL" != "None" ]
                printf 'url=%s\n' "$URL" > .env
                echo "Deployed application URL configured for Playwright."

          - task: Bash@3
            displayName: Run Playwright (python)
            inputs:
              targetType: inline
              workingDirectory: tests/e2e-test
              script: |
                set -euo pipefail
                python -m pip install uv
                uv pip install --system -r requirements.txt
                python -m playwright install --with-deps chromium
                xvfb-run -a pytest