# Azure DevOps - Bicep CI (static validation + unit tests)
#
# Runs on every PR to main with no path filter. Static infrastructure checks and hermetic unit
# tests run without Azure credentials; live end-to-end tests run in the deploy pipeline.

trigger: none

pr:
  branches:
    include:
      - main
      - agents-demo

pool:
  vmImage: ubuntu-latest

jobs:
  - job: infra_validation
    displayName: Bicep static validation
    variables:
      INFRA_DIR: infra
    steps:
      - checkout: self

      - task: Bash@3
        displayName: Install Bicep CLI
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            az bicep install
            az bicep version

      - task: Bash@3
        displayName: Lint and build
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            shopt -s nullglob globstar
            found=0
            for t in "$INFRA_DIR"/**/*.bicep; do
              found=1
              echo "----- lint $t";  az bicep lint  --file "$t"
              echo "----- build $t"; az bicep build --file "$t" --stdout >/dev/null
            done
            for p in "$INFRA_DIR"/**/*.bicepparam; do
              echo "----- build-params $p"; az bicep build-params --file "$p" --stdout >/dev/null
            done
            if [ "$found" -eq 0 ]; then
              echo "##vso[task.logissue type=error]No .bicep files found under $INFRA_DIR/"
              exit 1
            fi

      - task: Bash@3
        displayName: Validate JSON parameters
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            shopt -s nullglob globstar
            for p in "$INFRA_DIR"/**/main.parameters.json "$INFRA_DIR"/*.parameters.json; do
              echo "----- json check $p"
              python3 - "$p" <<'PY'
            import json, re, sys
            path = sys.argv[1]
            raw = open(path, encoding="utf-8").read()
            cleaned = re.sub(r"\$\{[^}]*\}", "", raw)
            json.loads(cleaned)
            print("ok", path)
            PY
            done

      - task: Bash@3
        displayName: Format check
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            shopt -s nullglob globstar
            rc=0
            for t in "$INFRA_DIR"/**/*.bicep "$INFRA_DIR"/**/*.bicepparam; do
              az bicep format --file "$t" --stdout > /tmp/formatted 2>/dev/null || continue
              if ! diff -q "$t" /tmp/formatted >/dev/null; then
                echo "##vso[task.logissue type=error;sourcepath=$t]Not formatted. Run: az bicep format --file $t"
                diff -u "$t" /tmp/formatted || true
                rc=1
              fi
            done
            exit $rc

  - job: unit_frontend
    displayName: Unit tests (frontend)
    steps:
      - checkout: self
      - task: Bash@3
        displayName: Install and test (frontend)
        inputs:
          targetType: inline
          workingDirectory: src/App
          script: |
            set -euo pipefail
            npm ci
            CI=true npm test

  - job: unit_backend_pytest
    displayName: Unit tests (backend, pytest)
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.11"
      - task: Bash@3
        displayName: Install and run pytest
        inputs:
          targetType: inline
          workingDirectory: .
          script: |
            set -euo pipefail
            python -m pip install uv pytest
            [ -f "infra/scripts/post-provision/requirements.txt" ] && uv pip install --system -r "infra/scripts/post-provision/requirements.txt" || true
            pytest

  - job: unit_backend_dotnet
    displayName: Unit tests (backend, dotnet)
    steps:
      - checkout: self
      - task: Bash@3
        displayName: dotnet test
        inputs:
          targetType: inline
          workingDirectory: src/api/dotnet/tests/CsApi.Tests
          script: |
            set -euo pipefail
            dotnet test --nologo